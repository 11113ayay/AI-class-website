<title>路線超量檢查工具 — 海報方向 C：極簡排版風</title>
<style>
  :root{
    --paper:#F6F4EE;
    --ink:#15140F;
    --accent:#C23B1E;
    --line:#15140F;

    --f-display:"Bahnschrift","Arial Narrow","Microsoft JhengHei","PingFang TC",sans-serif;
    --f-body:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
    --f-mono:"Cascadia Mono","Consolas","SF Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scrollbar-width:none;}
  body::-webkit-scrollbar{display:none;}
  body{
    background:#DAD5C6;
    color:var(--ink);
    font-family:var(--f-body);
  }
  body.clean{background:var(--paper);}
  body.clean .sheet{box-shadow:none;margin:0;}

  .sheet{
    max-width:860px;
    aspect-ratio:841/1189;
    margin:0 auto;
    background:var(--paper);
    box-shadow:0 30px 70px rgba(10,10,5,0.2);
    display:grid;
    grid-template-rows:auto 1fr auto auto auto;
    padding:56px 56px 44px;
    position:relative;
  }
  .noise-field{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  .sheet > *:not(.noise-field){position:relative;}

  .row-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    font-family:var(--f-mono);
    font-size:0.78rem;
    letter-spacing:0.05em;
    padding-bottom:24px;
    border-bottom:1.5px solid var(--line);
  }
  .row-top .name{
    font-family:var(--f-display);
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:0.01em;
  }
  .row-top .r{text-align:right; color:var(--ink); opacity:0.6;}

  .hero{
    display:flex; flex-direction:column; justify-content:center;
    padding:30px 0;
  }
  .hero .q{
    font-family:var(--f-display);
    font-weight:800;
    font-size:clamp(1.8rem,4.2vw,2.5rem);
    line-height:1.15;
    max-width:15ch;
    margin:0 0 40px;
  }
  .stat-row{
    position:relative;
  }
  .hero .stat{
    display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  }
  .hero .stat .pct{
    font-family:var(--f-mono);
    font-weight:700;
    font-size:1.15rem;
    color:var(--paper);
    background:var(--ink);
    padding:5px 12px;
    letter-spacing:0.02em;
  }
  .qr-guide{
    position:absolute;
    right:14px;
    top:100%;
    margin-top:16px;
    display:flex; align-items:flex-end; gap:10px;
  }
  .qr-guide .trail{width:52px;height:32px;flex:none;}
  .qr-guide .runtext{
    writing-mode:vertical-rl;
    font-family:var(--f-mono);
    font-size:0.6rem;
    letter-spacing:0.3em;
    color:var(--accent);
    padding-bottom:4px;
  }
  .qr-guide .qr{
    width:76px;height:76px;
    border:1.5px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--f-mono);font-size:0.54rem;text-align:center;
    position:relative;
    flex:none;
  }
  .qr-guide .qr::before,.qr-guide .qr::after{content:"";position:absolute;width:9px;height:9px;}
  .qr-guide .qr::before{top:-5px;left:-5px;border-top:1.5px solid var(--accent);border-left:1.5px solid var(--accent);}
  .qr-guide .qr::after{bottom:-5px;right:-5px;border-bottom:1.5px solid var(--accent);border-right:1.5px solid var(--accent);}
  .hero .stat .num{
    font-family:var(--f-mono);
    font-weight:700;
    font-size:clamp(3rem,10.5vw,6.6rem);
    line-height:0.85;
    color:var(--accent);
    letter-spacing:-0.01em;
  }
  .hero .stat .unit{
    font-family:var(--f-display);
    font-weight:800;
    font-size:1.6rem;
  }
  .hero .cap{
    font-size:1rem;
    margin-top:96px;
    max-width:34ch;
    color:var(--ink);
  }
  .hero .cap b{color:var(--accent);}

  .rule{border-top:1.5px solid var(--line); margin:0;}

  .facts{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:22px 0;
  }
  .facts div{border-left:1px solid var(--line); padding:0 16px 0 16px;}
  .facts div:first-child{border-left:none; padding-left:0;}
  .facts .n{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;}
  .facts .l{font-size:0.72rem;letter-spacing:0.04em;margin-top:3px;opacity:0.65;}

  .foot{
    padding-top:22px;
    font-family:var(--f-mono);
    font-size:0.72rem;
    letter-spacing:0.03em;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
  }
  .foot .case{max-width:56ch;}
  .foot .case b{color:var(--accent);font-family:var(--f-body);}
  .foot .note{
    font-size:0.62rem;
    color:var(--ink);
    opacity:0.55;
    white-space:nowrap;
    flex:none;
  }
</style>
